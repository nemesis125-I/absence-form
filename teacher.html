<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교사용 결석신고서 관리</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container wide">
  <header class="hero">
    <h1>교사용 결석신고서 관리</h1>
    <p>교사용 비밀번호를 입력해야 제출 목록을 확인할 수 있습니다.</p>
  </header>

  <section id="loginPanel" class="card">
    <h2>교사용 로그인</h2>
    <label>비밀번호
      <input id="password" type="password" inputmode="numeric" maxlength="20">
    </label>
    <button id="loginBtn" class="primary" type="button">확인</button>
    <p id="loginError" class="error" hidden></p>
  </section>

  <section id="app" hidden>
    <div class="toolbar card">
      <div class="stack">
        <label>학년
          <select id="gradeFilter">
            <option value="">전체</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option>
          </select>
        </label>
        <label>반
          <select id="classFilter">
            <option value="">전체</option><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option><option value="5">5반</option>
          </select>
        </label>
      </div>
      <div class="button-row">
        <button id="reloadBtn" class="secondary" type="button">목록 새로고침</button>
        <button id="logoutBtn" class="secondary" type="button">로그아웃</button>
      </div>
    </div>

    <div id="listMessage" class="message" hidden></div>
    <div id="list" class="list"></div>

    <section id="detail" class="detail card" hidden>
      <div class="detail-head">
        <h2 id="detailTitle">상세보기</h2>
        <button id="closeDetail" class="secondary" type="button">목록으로</button>
      </div>

      <div class="preview-wrap">
        <canvas id="formCanvas" width="1190" height="1682"></canvas>
      </div>

      <div class="card inner">
        <h3>학생 입력 내용 수정</h3>
        <p class="hint">학생이 잘못 입력한 경우 고친 뒤 "수정 내용 저장"을 누르세요. 고치는 동안 위 양식에 바로 반영됩니다.</p>
        <div class="checks">
          <label><input type="radio" name="reasonFix" value="질병"> 질병</label>
          <label><input type="radio" name="reasonFix" value="인정"> 인정(경조사 포함)</label>
        </div>
        <label>사유 상세
          <textarea id="editReasonDetail" rows="3" maxlength="500"></textarea>
        </label>
        <div class="stack">
          <label>결석 시작일
            <input id="editStartDate" type="date">
          </label>
          <label>결석 종료일
            <input id="editEndDate" type="date">
          </label>
        </div>
        <div class="stack">
          <label>결석 일수
            <input id="editAbsenceDays" type="number" min="1" step="1">
          </label>
          <label>작성일(제출일)
            <input id="editSubmitDate" type="date">
          </label>
        </div>
        <p id="editDaysHint" class="hint">날짜를 바꾸면 주말·공휴일을 빼고 일수를 다시 계산합니다. 재량휴업일 등은 직접 고치세요.</p>
        <div class="button-row">
          <button id="saveEdit" class="primary" type="button">수정 내용 저장</button>
          <button id="resetEdit" class="secondary" type="button">되돌리기</button>
        </div>

        <h3 style="margin-top:20px">담임교사 확인</h3>
        <div class="checks">
          <label><input type="checkbox" name="checkMethod" value="학부모 전화 통화"> 학부모 전화 통화</label>
          <label><input type="checkbox" name="checkMethod" value="보호자 문자 확인"> 보호자 문자 확인</label>
          <label><input type="checkbox" name="checkMethod" value="증빙서류 확인"> 증빙서류 확인</label>
          <label><input type="checkbox" name="checkMethod" value="학생 면담"> 학생 면담</label>
          <label><input type="checkbox" name="checkMethod" value="기타"> 기타</label>
        </div>
        <label id="checkExtraWrap" hidden>기타 내용
          <textarea id="checkExtra" rows="3" maxlength="500"></textarea>
        </label>
        <label>확인 일자
          <input id="checkDate" type="date">
        </label>
        <div class="button-row">
          <button id="saveCheck" class="primary" type="button">확인내용 저장</button>
          <button id="toggleDone" class="secondary" type="button">확인 완료/취소</button>
          <button id="printBtn" class="secondary" type="button">인쇄</button>
          <button id="savePngBtn" class="secondary" type="button">이미지 저장</button>
          <button id="deleteBtn" class="danger" type="button">삭제</button>
        </div>
        <p id="detailMessage" class="message" hidden></p>
      </div>

      <div id="evidenceBox" class="card inner" hidden>
        <h3>증빙사진</h3>
        <img id="evidenceImg" alt="증빙사진" style="display:block;max-width:100%;height:auto;border:1px solid #ddd;border-radius:8px">
        <div class="button-row">
          <button id="saveEvidenceBtn" class="secondary" type="button">증빙사진 저장</button>
        </div>
      </div>
    </section>
  </section>
</main>

<script type="module" src="teacher.js"></script>
</body>
</html>
